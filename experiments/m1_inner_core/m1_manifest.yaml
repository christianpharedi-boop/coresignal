experiment_id: m1_inner_core_lod_v001
protocol_version: 0.5.0
status: specified
random_seed: null
execution_gate: blocked_pending_observable_and_overlap_control
gate1_audit_status: deferred_pending_reconstruction
candidate_decision: not_yet_accepted
gate2_manifest: data/m1_gate2/gate2_acquisition_manifest.yaml
purpose: test whether a pre-specified inner-core seismic observable improves one-day-ahead LOD prediction beyond a matched M0 control

control:
  original_m0_test_interval: 2016-11-11 to 2026-07-18
  required_comparison: matched_rolling_m0_on_same_observed_interval
  original_m0_result_immutable: true
  current_candidate_design: m1_overlap_2016_2023_only_if_reconstruction_succeeds
  full_m0_comparison_supported: false

observable:
  name: null
  type: event_level_pkikp_change_score
  registry_source_id: inner_core_seismic_primary
  selection_status: provisional_unverified
  physical_interpretation: seismic_change_sensitive_to_inner_core_penetrating_path
  source: null
  source_version: null
  source_sha256: null
  event_ids: null
  station_ids: null
  latest_observed_date: null
  uncertainty_definition: null

feature_construction:
  temporal_resolution: null
  aggregation_rule: null
  smoothing_rule: null
  missingness_rule: null
  availability_indicator_required: true
  future_information_prohibited: true

target:
  variable: dLOD
  unit: s
predictors:
  - LOD_history
  - pre_specified_inner_core_feature
prohibited_features:
  - post hoc correlation-selected_inner_core_series
  - future_inner_core_observations
  - imputed_primary_test_predictor
  - geomagnetic_variables

model:
  family: fixed_pre_registered_model
  hyperparameters: null
  lag_structure: null
  selection_before_test: true

validation:
  method: rolling_origin
  horizon: 1 day
  shuffle: false
  test_interval: null
  final_test_locked: true
  test_locked: true
  common_observed_interval_required: true
  temporal_coverage_audit_required: true

controls:
  - matched_m0_rolling_persistence
  - phase_randomized_inner_core_surrogate
  - time_shifted_inner_core_surrogate
  - negative_control_seismic_quantity

primary_metric:
  name: paired_test_rmse_difference_ms
  direction: lower_is_better
secondary_metrics:
  - mae_ms
  - mean_error_ms
  - correlation
  - skill_vs_matched_m0

acceptance:
  threshold_declared_before_final_test: true
  minimum_improvement_ms: null
  uncertainty_rule: null
  surrogate_control_required: true
  leave_one_event_family_out_required: true
  no_scientific_support_without_all_gates: true

status_states:
  - specified
  - ingested
  - feature_verified
  - executed
  - reproduced
  - supported
  - not_supported

blocking_reasons:
  - observable_not_selected
  - authoritative_source_not_locked
  - temporal_coverage_not_audited
  - feature_construction_not_frozen
  - matched_rolling_m0_not_run
  - event_station_waveform_inputs_not_hashed
  - deterministic_pkikp_metric_not_frozen
  - uncertainty_and_missingness_rules_not_frozen
  - gate2_source_package_not_acquired
