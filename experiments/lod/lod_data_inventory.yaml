experiment_id: lod_data_inventory_v001

purpose: Establish and validate the admitted LOD dataset before modelling.

required_state: admitted

target:
  variable: dLOD
  unit: ms

prohibited:
  - target_leakage
  - unverified_source
  - modified_raw_data

outputs:
  - provenance_record
  - source_hash
  - coverage_report
  - quality_control_report
predictors:
  - admitted_source_metadata
model:
  family: data_inventory_quality_control
  lag: none
validation:
  method: fixed_temporal_holdout
  final_test_locked: true
primary_metric:
  name: provenance_and_quality_gate_pass
  direction: higher_is_better
acceptance:
  threshold_declared_before_final_test: true
