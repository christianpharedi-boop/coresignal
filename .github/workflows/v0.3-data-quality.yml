name: CoreSignal v0.3 data quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate provenance registry
        run: python scripts/validate_provenance.py .

      - name: Enforce English-only policy
        run: python scripts/check_english_only.py .

      - name: Run v0.3 tests
        run: python -m unittest discover -s tests -v
