name: CoreSignal M0 baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: test -f experiments/m0_lod/m0_manifest.yaml
      - run: test -f docs/M0_BASELINE_PROTOCOL.md
