schema:
  id: coresignal_m1_gate2a_acquisition_ledger
  version: "1.0.0"
  title: CoreSignal M1 Gate 2A Acquisition Ledger
  purpose: Immutable acquisition ledger for source files required by M1 reconstruction.
  scientific_principle: Acquisition identity is independent of LOD observations and M1 outcomes.
  execution_policy: fail_closed
  default_execution_status: BLOCKED

status:
  allowed: [PLANNED, ACQUIRED, VERIFIED, REJECTED, SUPERSEDED]
  verification: [PENDING, VERIFIED, FAILED]
  licence: [PENDING, VERIFIED, RESTRICTED, UNKNOWN, NOT_APPLICABLE]
  file_state: [required, optional]

ledger:
  required: [ledger_id, schema_version, experiment_id, gate, frozen_manifest_id, created_utc, execution_policy, files, ledger_integrity]
  ledger_id_pattern: '^gate2a_[a-z0-9_]+$'
  schema_version: '1.0.0'
  experiment_id: m1_inner_core
  gate: M1-Gate-2A
  execution_policy: fail_closed

file_record:
  required: [record_id, manifest_file_id, file_state, scientific_role, source, acquisition, integrity, licence, verification, execution]
  record_id_pattern: '^gate2a_file_[0-9]{4}$'
  roles: [event_table, event_pair_table, station_table, waveform_reference, waveform_data, supplementary_metadata, publication_metadata, other]
  source_required: [provider, source_url, source_version, access_method]
  acquisition_required: [acquisition_timestamp_utc, original_filename, byte_size, transfer_status]
  integrity_required: [sha256, hash_algorithm]
  integrity_sha256_pattern: '^[a-f0-9]{64}$'
  licence_required: [status, name, evidence]
  verification_required: [status, verified_at_utc, checks]
  execution_required: [status, blocking]
  pending_hash_allowed_when: 'file_status in [PLANNED, ACQUIRED]'
  verified_hash_required_when: 'file_status in [VERIFIED, READY_FOR_GATE2_RECONSTRUCTION]'

ledger_integrity:
  required: [record_count, unique_record_ids, unique_manifest_file_ids, all_required_files_present, ledger_status]
  allowed_status: [BLOCKED, READY_FOR_GATE2_RECONSTRUCTION, INVALID]

clearance:
  ready_status: READY_FOR_GATE2_RECONSTRUCTION
  requires:
    - all_required_files_present
    - unique_record_ids
    - unique_manifest_file_ids
    - every_required_file_verified
    - every_required_file_sha256_valid
    - every_required_file_source_identity_verified
    - every_required_file_version_verified
    - no_blocking_transfer_failures
    - analysis_rights_verified_for_each_required_file
    - frozen_manifest_unchanged

rules:
  - source_file_changes_require_new_record_and_hash
  - superseded_records_are_immutable
  - acquisition_timestamps_are_actual_utc_events
  - sha256_is_byte_identity_not_legal_or_scientific_provenance
  - lod_and_m1_outcomes_cannot_change_acquisition_identity
  - gate2a_completion_does_not_clear_m1_modeling
  - unknown_or_pending_licence_blocks_redistribution
  - reconstruction_cannot_begin_before_ready_status
