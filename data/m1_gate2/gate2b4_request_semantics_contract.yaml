contract_id: coresignal_m1_gate2b4_request_semantics_v001
status: FROZEN
execution_policy: fail_closed
lod_access: prohibited
waveform_bytes_access: prohibited
waveform_analysis: prohibited

frozen_request:
  request_set_id: WAVEFORM_COVERAGE_PROBE_v001
  request_set_sha256: 378a72e35379e3d33fc7b048ae378bb916e13563017b31d61487a3a2911e5f38
  network: IM
  stations: [ILAR, YKA]
  location: FB
  channel: SHZ
  service: EarthScope FDSN dataselect
  endpoint: https://service.earthscope.org/fdsnws/dataselect/1/query
  time_format: ISO-8601 UTC with Z suffix
  window_start_offset_seconds: -120
  window_end_offset_seconds: 1800

semantic_checks:
  - check_id: identity_station_channel
    requirement: Frozen IM.FB.SHZ must match authoritative station metadata and published request scope.
  - check_id: temporal_parameters
    requirement: Start/end parameters must be valid UTC ISO-8601 values and preserve event-origin windows.
  - check_id: service_request_semantics
    requirement: EarthScope dataselect documentation must define the endpoint and accepted request parameters.
  - check_id: historical_archive_semantics
    requirement: An authoritative mechanism must establish whether historical data can be addressed for the frozen requests.
  - check_id: alternative_channel_or_location
    requirement: Any alternative must be predeclared, metadata-supported, scientifically equivalent, and versioned as a new probe request set.

allowable_alternatives:
  - alternative_id: none_without_evidence
    condition: No alternative may be tried merely because it returns bytes.
  - alternative_id: metadata-supported_location_or_channel
    condition: Only if authoritative station/archive metadata explicitly maps it to the same scientific observation.

outcomes:
  - REQUEST_SEMANTICS_VERIFIED
  - REQUEST_SEMANTICS_DEFERRED
  - REQUEST_SEMANTICS_INVALID

consequences:
  REQUEST_SEMANTICS_VERIFIED: Re-run the immutable v001 coverage probe or create a justified versioned probe only if parameters change.
  REQUEST_SEMANTICS_DEFERRED: Keep v001 and full acquisition blocked.
  REQUEST_SEMANTICS_INVALID: Reconstruct the acquisition contract; do not retrieve waveforms.

versioning:
  v001_immutable: true
  overwrite_existing_probe: prohibited
  corrected_probe_must_be_new_version: true
