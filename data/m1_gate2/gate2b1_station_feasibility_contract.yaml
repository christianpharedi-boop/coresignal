contract_id: coresignal_m1_gate2b1_station_feasibility_v001
status: FROZEN
execution_policy: fail_closed
lod_access: prohibited
waveform_bytes_access: prohibited

station_inventory_required_fields:
  - network
  - station
  - location
  - channel
  - latitude
  - longitude
  - elevation
  - start_date
  - end_date
  - response_metadata_identity
  - archive_provider
  - query_parameters
  - response_identity_sha256
  - retrieval_timestamp_utc

required_arrays:
  - ILAR
  - YKA

pair_feasibility_required_fields:
  - pair_id
  - event_a
  - event_b
  - event_a_origin_utc
  - event_b_origin_utc
  - station
  - channel
  - station_operational_at_event_a
  - station_operational_at_event_b
  - channel_available_at_event_a
  - channel_available_at_event_b
  - archive_coverage_status
  - pkikp_request_feasible
  - decision_basis

feasibility_states:
  - FEASIBLE
  - INFEASIBLE
  - UNKNOWN
  - DEFERRED

authorization:
  waveform_retrieval_authorized_only_if:
    - event_reconstruction_pass
    - pair_reconstruction_pass
    - station_inventory_pass
    - all_required_pair_paths_feasible
    - archive_coverage_verified
    - request_set_frozen_and_hashed
  default: NOT_AUTHORIZED

lod_independence:
  required: true
  no_lod_dates_or_metrics_allowed: true

outputs:
  - immutable_station_inventory
  - per_pair_feasibility_report
  - immutable_waveform_request_set_only_if_authorized
