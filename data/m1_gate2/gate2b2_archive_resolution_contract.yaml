contract_id: coresignal_m1_gate2b2_archive_resolution_v001
status: FROZEN
execution_policy: fail_closed
lod_access: prohibited
waveform_bytes_access: prohibited_until_authorized
scientific_population_change: prohibited
station_substitution: prohibited
date_window_broadening: prohibited

candidate_archive_mechanisms:
  - archive_id: earthscope_fdsn_dataselect_v001
    provider: EarthScope / NSF SAGE
    endpoint: https://service.earthscope.org/fdsnws/dataselect/1
    service: FDSN dataselect
    purpose: Determine whether exact miniSEED requests can be answered; no waveform bytes at this gate.
    authority_basis: EarthScope migration notice and NSF SAGE waveform-data documentation
    authority_status: VERIFIED
    request_semantics_status: VERIFIED
    coverage_status: UNKNOWN
    decision: DEFER
  - archive_id: iris_fdsn_availability_legacy_v001
    provider: EarthScope / NSF SAGE legacy endpoint
    endpoint: https://service.iris.edu/fdsnws/availability/1/query
    service: FDSN availability
    purpose: Candidate availability mechanism retained for transparent failure evidence.
    authority_basis: IRIS FDSN availability documentation
    authority_status: VERIFIED
    request_semantics_status: VERIFIED
    coverage_status: FAIL_ENDPOINT_HTTP_410
    decision: DEFER
  - archive_id: cnsn_archive_v001
    provider: Canadian National Seismograph Network
    endpoint: https://earthquakescanada.nrcan.gc.ca/stndon/CNSN-RNSC/index-en.php
    service: CNSN archive access
    purpose: Candidate archive mechanism for YKA-associated records if authoritative request semantics are established.
    authority_basis: CNSN network source reference
    authority_status: VERIFIED
    request_semantics_status: UNKNOWN
    coverage_status: UNKNOWN
    decision: DEFER

resolution_fields_required:
  - provider
  - endpoint
  - request_spec_hash
  - query_timestamp_utc
  - http_status
  - response_bytes
  - response_sha256
  - coverage_status
  - authority_status
  - decision

waveform_request_set:
  status: NOT_FROZEN
  path: null
  sha256: null
  authorized_only_if:
    - archive_authority_verified
    - request_semantics_verified
    - date_specific_coverage_verified
    - exact_event_station_channel_set_unchanged
  default_decision: DEFER
