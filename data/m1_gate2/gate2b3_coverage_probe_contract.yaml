contract_id: coresignal_m1_gate2b3_coverage_probe_v001
status: FROZEN
execution_policy: fail_closed
lod_access: prohibited
waveform_analysis: prohibited
scientific_population_change: prohibited
station_change: prohibited
channel_change: prohibited
authoritative_service: EarthScope FDSN dataselect
service_endpoint: https://service.earthscope.org/fdsnws/dataselect/1/query

selection_rule:
  source_population: 143 reconstructed event pairs
  temporal_blocks:
    - label: earliest_eligible
      rule: lexicographically earliest event-pair record by event_a_origin_utc, then pair_id
    - label: latest_eligible
      rule: lexicographically latest event-pair record by event_b_origin_utc, then pair_id
    - label: middle_period
      rule: record at floor((n-1)/2) after sorting unique pairs by event_a_origin_utc, event_b_origin_utc, pair_id
    - label: block_1991_1999
      rule: earliest pair with both event origins in 1991-01-01 through 1999-12-31
    - label: block_2000_2009
      rule: earliest pair with both event origins in 2000-01-01 through 2009-12-31
    - label: block_2010_2019
      rule: earliest pair with both event origins in 2010-01-01 through 2019-12-31
    - label: block_2020_2023
      rule: earliest pair with both event origins in 2020-01-01 through 2023-12-31
  stations: [ILAR, YKA]
  duplicate_requests_removed: true

request_parameters:
  network: IM
  location: FB
  channel: SHZ
  start_offset_seconds: -120
  end_offset_seconds: 1800
  format: miniSEED

coverage_states:
  - COVERAGE_ESTABLISHED
  - COVERAGE_PARTIAL
  - COVERAGE_UNKNOWN
  - COVERAGE_FAILED

promotion_rule:
  freeze_full_waveform_request_set_only_if: COVERAGE_ESTABLISHED
  authorize_full_acquisition_only_if: COVERAGE_ESTABLISHED
  partial_result_action: DEFER_AND_DO_NOT_SUBSTITUTE
