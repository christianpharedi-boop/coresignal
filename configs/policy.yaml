character_policy:
  name: english_only
  version: "1.0"
  reject:
    - cjk_unified_ideographs
    - cjk_extensions
    - hiragana
    - katakana
    - hangul
    - cjk_punctuation
    - fullwidth_forms

scan:
  extensions:
    - .py
    - .md
    - .mdx
    - .txt
    - .rst
    - .tex
    - .bib
    - .cff
    - .yaml
    - .yml
    - .json
    - .toml
    - .csv
    - .ipynb
    - .svg
    - .xml
    - .html
    - .css
    - .js
    - .ts
    - .pdf
    - .eps
    - .png
    - .jpg
    - .jpeg
    - .webp
