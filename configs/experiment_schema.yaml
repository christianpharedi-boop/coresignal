experiment:
  required:
    - experiment_id
    - target
    - predictors
    - model
    - validation
    - primary_metric
    - acceptance

target:
  required:
    - variable
    - unit

validation:
  allowed:
    - rolling_origin
    - blocked_temporal
    - fixed_temporal_holdout

acceptance:
  required:
    - threshold_declared_before_final_test
